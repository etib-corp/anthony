name: Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  LUNARG_VULKAN_SDK_VERSION: 1.4.304.1
  JAVA_TUMERIN_JDK_VERSION: 21
  ANDROID_NDK_VERSION: r27d
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            operating-system: linux
            runner: ubuntu-latest
          - name: MacOS
            operating-system: macos
            runner: macos-latest
          - name: Windows
            operating-system: windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Ubuntu dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Configure Vulkan SDK using the downloaded spec
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.LUNARG_VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Setup JDK
        if: matrix.operating-system == 'android'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_TUMERIN_JDK_VERSION }}

      - name: Setup Android NDK
        if: matrix.operating-system == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake --build ${{ github.workspace }}/build

      - name: Run tests
        if: matrix.operating-system != 'android'
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          --output-on-failure
